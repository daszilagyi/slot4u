name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The audit job below is the reason for a schedule (SLO-148). A vulnerability
  # is published on somebody else's timetable, not ours: an audit that only runs
  # on a pull request tells you what was true the day you merged, and stays
  # silent for however long nobody touches the repository.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  php:
    name: PHP — Pint, Larastan, Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd, bcmath, pcntl, pdo_sqlite, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest (tests)
        run: php artisan test

  frontend:
    name: Frontend — ESLint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        # `cache: npm` stays the explicit instruction. setup-node@v5 added
        # automatic caching when package.json carries a `packageManager` field —
        # ours does not, so nothing layers on top of this (SLO-164).
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run types

      - name: Build (client + SSR)
        run: npm run build

  ssr:
    name: SSR — publikus szerver-render smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd, bcmath, pcntl, pdo_sqlite, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets (client + SSR bundle)
        run: npm run build

      - name: Start Inertia SSR renderer
        run: |
          node bootstrap/ssr/ssr.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:13714/health > /dev/null; then
              echo "SSR renderer up"; exit 0
            fi
            sleep 1
          done
          echo "SSR renderer did not become healthy" >&2; exit 1

      - name: SSR smoke test (live renderer, throw on error)
        env:
          INERTIA_SSR_URL: http://127.0.0.1:13714
        run: php artisan test --filter=PublicSsrSmokeTest

  audit:
    name: Függőség-audit — composer + npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd, bcmath, pcntl, pdo_sqlite, redis
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Reads the lock files; no install needed for either audit, which keeps
      # this job fast enough to run on every pull request.
      #
      # ⚠️ `--locked` on purpose: auditing an installed tree would report on
      # whatever composer happened to resolve, while the lock file is what
      # actually ships. Those differ exactly when it matters.
      - name: composer audit
        run: composer audit --locked --format=plain

      # ⚠️ The threshold is `high`, and it is a real gate rather than a report.
      # Below it the noise wins: this project's first audit found 17 composer
      # advisories and 6 npm ones, and a check that is red on the day it lands
      # gets muted rather than acted on. They were fixed before this job existed
      # (SLO-148), so red here means something new — which is the only way a
      # gate stays worth reading.
      #
      # `low`/`moderate` still print, they just do not fail: `--audit-level`
      # controls the exit code, not the output.
      - name: npm audit
        run: npm audit --audit-level=high
