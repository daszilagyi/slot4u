name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP — Pint, Larastan, Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd, bcmath, pcntl, pdo_sqlite, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest (tests)
        run: php artisan test

  frontend:
    name: Frontend — ESLint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        # `cache: npm` stays the explicit instruction. setup-node@v5 added
        # automatic caching when package.json carries a `packageManager` field —
        # ours does not, so nothing layers on top of this (SLO-164).
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run types

      - name: Build (client + SSR)
        run: npm run build

  ssr:
    name: SSR — publikus szerver-render smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, gd, bcmath, pcntl, pdo_sqlite, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets (client + SSR bundle)
        run: npm run build

      - name: Start Inertia SSR renderer
        run: |
          node bootstrap/ssr/ssr.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:13714/health > /dev/null; then
              echo "SSR renderer up"; exit 0
            fi
            sleep 1
          done
          echo "SSR renderer did not become healthy" >&2; exit 1

      - name: SSR smoke test (live renderer, throw on error)
        env:
          INERTIA_SSR_URL: http://127.0.0.1:13714
        run: php artisan test --filter=PublicSsrSmokeTest
